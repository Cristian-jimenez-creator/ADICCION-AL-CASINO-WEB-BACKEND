spring.application.name=simulador-backend
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/simulador?replicaSet=rs0}
spring.data.mongodb.auto-index-creation=true
app.jwt.secret=${APP_JWT_SECRET:local-only-change-this-secret-before-deploying-0001}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.game-content-dir=${APP_GAME_CONTENT_DIR:./game-content}
server.port=${PORT:8080}
